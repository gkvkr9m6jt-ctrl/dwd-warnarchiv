name: DWD-Warnarchiv

on:
  schedule:
    # stündlich (UTC). Verspätete oder ausgefallene Läufe sind unkritisch,
    # weil das Skript verpasste Dateien der letzten ~48 h nachholt.
    - cron: '17 * * * *'
  workflow_dispatch:   # manueller Start über den Reiter "Actions"
    inputs:
      testalarm:
        description: 'Alarm testweise auslösen (legt ein Issue an)'
        type: boolean
        default: false

permissions:
  contents: write      # Datenbank zurückschreiben
  issues: write        # Alarm-Issue anlegen

concurrency:
  group: dwd-warnarchiv
  cancel-in-progress: false

jobs:
  archivieren:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Warnungen abrufen, speichern und Vollständigkeit prüfen
        run: python dwd_warnarchiv.py --export

      - name: Ergebnis ins Repository schreiben
        if: always()
        run: |
          git config user.name  "dwd-archiv-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dwd_warnungen.sqlite export_*.csv || true
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Archiv-Update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Testalarm
        if: ${{ inputs.testalarm }}
        run: |
          echo "- Testalarm, manuell ausgelöst. Kein Handlungsbedarf." > alarm.txt
          exit 1

      - name: Alarm-Issue anlegen
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          LAUF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titel="Warnarchiv: Alarm"
          gruende="$(cat alarm.txt 2>/dev/null || echo '- Lauf fehlgeschlagen, Ursache siehe Log.')"
          body="$(printf 'Zeitpunkt: %s UTC\nLauf: %s\n\n%s\n\nBitte prüfen. Daten auf dem DWD-Server bleiben ca. 48 h verfügbar und werden nach Behebung automatisch nachgeholt.' "$(date -u '+%d.%m.%Y %H:%M')" "$LAUF_URL" "$gruende")"
          nr="$(gh issue list --state open --search "in:title \"$titel\"" --json number -q '.[0].number')"
          if [ -n "$nr" ]; then
            gh issue comment "$nr" --body "$body"
          else
            gh issue create --title "$titel" --body "$body"
          fi
